<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大学VTuberリスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF7F5;
    --ink: #2B2233;
    --ink-soft: #6B6178;
    --line: #E4DCE6;
    --accent: #D84E7A;
    --accent-soft: #F7DDE6;
    --teal: #2F9E93;
    --teal-soft: #DDF1EE;
    --card: #FFFFFF;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1C1720;
      --ink: #F1EAF0;
      --ink-soft: #B4A9BC;
      --line: #3A3140;
      --accent: #F080A5;
      --accent-soft: #3A2530;
      --teal: #5FCFC2;
      --teal-soft: #1C3532;
      --card: #251E2A;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1C1720;
    --ink: #F1EAF0;
    --ink-soft: #B4A9BC;
    --line: #3A3140;
    --accent: #F080A5;
    --accent-soft: #3A2530;
    --teal: #5FCFC2;
    --teal-soft: #1C3532;
    --card: #251E2A;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }
  header.page-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  h1 {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 900;
    font-size: 28px;
    margin: 0;
    letter-spacing: 0.01em;
  }
  h1 span {
    color: var(--accent);
  }
  .count {
    font-size: 13px;
    color: var(--ink-soft);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 24px;
  }

  .card h2 {
    font-family: "Zen Maru Gothic", sans-serif;
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 16px;
    color: var(--ink);
  }

  form.entry-form {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
  }
  @media (max-width: 900px) {
    form.entry-form { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 560px) {
    form.entry-form { grid-template-columns: 1fr 1fr; }
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field label {
    font-size: 12px;
    color: var(--ink-soft);
  }
  .field input, .field select {
    font: inherit;
    font-size: 14px;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    outline-offset: 2px;
  }
  .field input:focus-visible, .field select:focus-visible, button:focus-visible, th button:focus-visible {
    outline: 2px solid var(--accent);
  }
  .form-actions {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 2px;
  }
  button {
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  button:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
  }
  .btn-primary:hover { opacity: 0.9; }

  .table-scroll {
    overflow-x: auto;
    border-radius: 14px;
    border: 1px solid var(--line);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 680px;
    background: var(--card);
  }
  thead th {
    text-align: left;
    padding: 0;
    background: var(--accent-soft);
    border-bottom: 1px solid var(--line);
  }
  thead th button {
    width: 100%;
    background: transparent;
    border-radius: 0;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: space-between;
    font-weight: 600;
    font-size: 13px;
    color: var(--ink);
    text-align: left;
  }
  thead th button:hover { background: rgba(0,0,0,0.04); }
  .arrow { font-size: 11px; color: var(--accent); min-width: 12px; }
  tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(0,0,0,0.02); }
  .kana { font-size: 12px; color: var(--ink-soft); display: block; margin-top: 2px; }
  .badge {
    display: inline-block;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--teal-soft);
    color: var(--teal);
  }
  .badge-status {
    display: inline-block;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 500;
  }
  .badge-status.active {
    background: var(--teal-soft);
    color: var(--teal);
  }
  .badge-status.retired {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .row-actions {
    display: flex;
    gap: 8px;
  }
  .row-actions button {
    padding: 5px 10px;
    font-size: 12px;
  }
  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .search input {
    font: inherit;
    font-size: 14px;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    min-width: 220px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <h1>大学VTuber<span>リスト</span></h1>
    <div class="count" id="count">0件登録中</div>
  </header>

  <div class="card">
    <h2 id="form-title">新しく登録する</h2>
    <form class="entry-form" id="entry-form">
      <div class="field">
        <label for="f-agency">所属事務所</label>
        <input type="text" id="f-agency" placeholder="例：にじさんじ">
      </div>
      <div class="field">
        <label for="f-name">名前</label>
        <input type="text" id="f-name" placeholder="例：星影 すばる">
      </div>
      <div class="field">
        <label for="f-kana">名前の読み</label>
        <input type="text" id="f-kana" placeholder="例：ほしかげ すばる">
      </div>
      <div class="field">
        <label for="f-debut">デビュー年月日</label>
        <input type="date" id="f-debut">
      </div>
      <div class="field">
        <label for="f-species">種族</label>
        <input type="text" id="f-species" placeholder="例：狼">
      </div>
      <div class="field">
        <label for="f-status">状況</label>
        <select id="f-status">
          <option value="active">活動中</option>
          <option value="retired">卒業・引退</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-ghost" id="cancel-edit" style="display:none;">キャンセル</button>
        <button type="submit" class="btn-primary" id="submit-btn">追加する</button>
      </div>
    </form>
  </div>

  <div class="toolbar">
    <div class="search">
      <input type="text" id="search" placeholder="名前・事務所・種族で検索">
    </div>
  </div>

  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th><button data-key="agency" type="button">所属事務所 <span class="arrow"></span></button></th>
          <th><button data-key="name" type="button">名前 <span class="arrow"></span></button></th>
          <th><button data-key="debut" type="button">デビュー年月日 <span class="arrow"></span></button></th>
          <th><button data-key="species" type="button">種族 <span class="arrow"></span></button></th>
          <th><button data-key="status" type="button">状況 <span class="arrow"></span></button></th>
          <th style="width:110px;"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="empty" id="empty-msg" style="display:none;">まだ登録がありません。上のフォームから追加してください。</div>
</div>

<script>
(function () {
  const STORAGE_KEY = "vtuber-list-v1";
  let data = [];
  let sortKey = "agency";
  let sortDir = 1; // 1 asc, -1 desc
  let editingId = null;

  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) data = JSON.parse(raw);
  } catch (e) {
    console.error("読み込みに失敗しました", e);
    data = [];
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      console.error("保存に失敗しました", e);
    }
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function fmtDate(d) {
    if (!d) return "—";
    const parts = d.split("-");
    if (parts.length !== 3) return d;
    return `${parts[0]}年${parseInt(parts[1],10)}月${parseInt(parts[2],10)}日`;
  }

  const tbody = document.getElementById("tbody");
  const emptyMsg = document.getElementById("empty-msg");
  const countEl = document.getElementById("count");
  const searchInput = document.getElementById("search");

  function render() {
    const query = searchInput.value.trim().toLowerCase();
    let rows = data.filter(r => {
      if (!query) return true;
      return [r.agency, r.name, r.kana, r.species].join(" ").toLowerCase().includes(query);
    });

    rows.sort((a, b) => {
      let va = (a[sortKey] || "");
      let vb = (b[sortKey] || "");
      if (sortKey === "debut") {
        va = va || "0000-00-00";
        vb = vb || "0000-00-00";
      } else {
        va = va.toString().toLowerCase();
        vb = vb.toString().toLowerCase();
      }
      if (va < vb) return -1 * sortDir;
      if (va > vb) return 1 * sortDir;
      return 0;
    });

    countEl.textContent = `${data.length}件登録中`;
    tbody.innerHTML = "";

    if (rows.length === 0) {
      emptyMsg.style.display = "block";
      emptyMsg.textContent = data.length === 0
        ? "まだ登録がありません。上のフォームから追加してください。"
        : "検索条件に一致するVTuberが見つかりません。";
      return;
    }
    emptyMsg.style.display = "none";

    for (const r of rows) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${r.agency ? escapeHtml(r.agency) : '<span class="badge">個人勢</span>'}</td>
        <td>${escapeHtml(r.name || "")}${r.kana ? `<span class="kana">${escapeHtml(r.kana)}</span>` : ""}</td>
        <td>${fmtDate(r.debut)}</td>
        <td>${escapeHtml(r.species || "—")}</td>
        <td>${statusBadge(r.status)}</td>
        <td>
          <div class="row-actions">
            <button type="button" class="btn-ghost" data-action="edit" data-id="${r.id}">編集</button>
            <button type="button" class="btn-ghost" data-action="delete" data-id="${r.id}">削除</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    }
  }

  function statusBadge(status) {
    if (status === "retired") return '<span class="badge-status retired">卒業・引退</span>';
    return '<span class="badge-status active">活動中</span>';
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  document.querySelectorAll("thead button[data-key]").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.key;
      if (sortKey === key) {
        sortDir *= -1;
      } else {
        sortKey = key;
        sortDir = 1;
      }
      document.querySelectorAll(".arrow").forEach(a => a.textContent = "");
      btn.querySelector(".arrow").textContent = sortDir === 1 ? "▲" : "▼";
      render();
    });
  });
  // default arrow
  document.querySelector('thead button[data-key="agency"] .arrow').textContent = "▲";

  const form = document.getElementById("entry-form");
  const fAgency = document.getElementById("f-agency");
  const fName = document.getElementById("f-name");
  const fKana = document.getElementById("f-kana");
  const fDebut = document.getElementById("f-debut");
  const fSpecies = document.getElementById("f-species");
  const fStatus = document.getElementById("f-status");
  const submitBtn = document.getElementById("submit-btn");
  const cancelBtn = document.getElementById("cancel-edit");
  const formTitle = document.getElementById("form-title");

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!fName.value.trim()) {
      fName.focus();
      return;
    }
    const entry = {
      agency: fAgency.value.trim(),
      name: fName.value.trim(),
      kana: fKana.value.trim(),
      debut: fDebut.value,
      species: fSpecies.value.trim(),
      status: fStatus.value,
    };
    if (editingId) {
      const idx = data.findIndex(d => d.id === editingId);
      if (idx !== -1) data[idx] = { ...data[idx], ...entry };
      exitEditMode();
    } else {
      entry.id = uid();
      data.push(entry);
    }
    save();
    form.reset();
    render();
  });

  function exitEditMode() {
    editingId = null;
    submitBtn.textContent = "追加する";
    formTitle.textContent = "新しく登録する";
    cancelBtn.style.display = "none";
    form.reset();
  }

  cancelBtn.addEventListener("click", exitEditMode);

  tbody.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === "delete") {
      const target = data.find(d => d.id === id);
      if (target && confirm(`「${target.name}」を削除しますか？`)) {
        data = data.filter(d => d.id !== id);
        save();
        render();
      }
    } else if (btn.dataset.action === "edit") {
      const target = data.find(d => d.id === id);
      if (!target) return;
      editingId = id;
      fAgency.value = target.agency || "";
      fName.value = target.name || "";
      fKana.value = target.kana || "";
      fDebut.value = target.debut || "";
      fSpecies.value = target.species || "";
      fStatus.value = target.status || "active";
      submitBtn.textContent = "更新する";
      formTitle.textContent = "編集中";
      cancelBtn.style.display = "inline-block";
      fAgency.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });

  searchInput.addEventListener("input", render);

  render();
})();
</script>
</body>
</html>
